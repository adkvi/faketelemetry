[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faketelemetry"
version = "0.2.0"
description = "Real-time Fake Telemetry Stream Generator"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Adam Billekvist", email = "adam.billeqvist@gmail.com"}
]
maintainers = [
    {name = "Adam Billekvist", email = "adam.billeqvist@gmail.com"}
]
keywords = [
    "telemetry",
    "signal",
    "generator",
    "iot",
    "testing",
    "simulation",
    "waveform",
    "python"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed"
]
requires-python = ">=3.7"
dependencies = []

[project.urls]
Homepage = "https://github.com/adkvi/faketelemetry"
Documentation = "https://github.com/adkvi/faketelemetry#readme"
Repository = "https://github.com/adkvi/faketelemetry"
Issues = "https://github.com/adkvi/faketelemetry/issues"
Changelog = "https://github.com/adkvi/faketelemetry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "black"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
